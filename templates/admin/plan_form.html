{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white fw-bold mb-0">{{ 'Edit' if plan else 'Create' }} Plan</h2>
            <a href="{{ url_for('plans.list_plans') }}" class="btn btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-2"></i>Back to Plans
            </a>
        </div>
        
        <div class="card bg-dark text-white border-0 shadow rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Plan Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control bg-black border-secondary text-white" name="name" value="{{ plan.name if plan else '' }}" required placeholder="e.g. Monthly Basic">
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Duration (Months) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control bg-black border-secondary text-white" name="duration_months" value="{{ plan.duration_months if plan else '' }}" required min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Price ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control bg-black border-secondary text-white" name="price" value="{{ plan.price if plan else '' }}" required min="0">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-secondary fw-bold">Description</label>
                        <textarea class="form-control bg-black border-secondary text-white" name="description" rows="3">{{ plan.description if plan else '' }}</textarea>
                    </div>
                    
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if not plan or plan.is_active %}checked{% endif %}>
                        <label class="form-check-label text-secondary" for="isActive">Plan is Active (Available for new members)</label>
                    </div>
                    
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm">
                        <i class="bi bi-save me-2"></i> Save Plan
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
