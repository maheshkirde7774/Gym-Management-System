{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white fw-bold mb-0">{{ 'Edit' if trainer else 'Add New' }} Trainer</h2>
            <a href="{{ url_for('trainers.list_trainers') }}" class="btn btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-2"></i>Back to Trainers
            </a>
        </div>
        
        <div class="card bg-dark text-white border-0 shadow rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-black border-secondary text-white" name="first_name" value="{{ trainer.first_name if trainer else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-black border-secondary text-white" name="last_name" value="{{ trainer.last_name if trainer else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control bg-black border-secondary text-white" name="email" value="{{ trainer.email if trainer else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-black border-secondary text-white" name="phone" value="{{ trainer.phone if trainer else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Specialization</label>
                            <input type="text" class="form-control bg-black border-secondary text-white" name="specialization" value="{{ trainer.specialization if trainer else '' }}" placeholder="e.g. Yoga, Weightlifting">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-bold">Experience (Years)</label>
                            <input type="number" class="form-control bg-black border-secondary text-white" name="experience_years" value="{{ trainer.experience_years if trainer else '' }}" min="0">
                        </div>
                        
                        <div class="col-12 mt-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if not trainer or trainer.is_active %}checked{% endif %}>
                                <label class="form-check-label text-secondary fw-bold" for="isActive">Trainer is Active</label>
                            </div>
                        </div>
                        
                        <div class="col-12 mt-4 text-end">
                            <button type="submit" class="btn btn-warning fw-bold px-4 py-2 rounded-pill shadow-sm">
                                <i class="bi bi-save me-2"></i> Save Trainer
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
