{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-warning text-uppercase">Contact Us</h1>
        <p class="lead text-secondary">Get in touch to start your membership</p>
    </div>

    <div class="row g-5 justify-content-center">
        <div class="col-lg-5">
            <div class="bg-dark p-5 rounded-4 h-100 border border-secondary border-opacity-25 shadow-lg">
                <h3 class="fw-bold text-white mb-4">Get In Touch</h3>
                
                <div class="d-flex mb-4">
                    <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0" style="width: 45px; height: 45px;">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    <div>
                        <h5 class="text-white mb-1">Address</h5>
                        <p class="text-secondary mb-0">123 Fitness Ave, NY</p>
                    </div>
                </div>
                
                <div class="d-flex mb-4">
                    <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0" style="width: 45px; height: 45px;">
                        <i class="bi bi-telephone-fill"></i>
                    </div>
                    <div>
                        <h5 class="text-white mb-1">Phone</h5>
                        <p class="text-secondary mb-0">(123) 456-7890</p>
                    </div>
                </div>
                
                <div class="d-flex">
                    <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0" style="width: 45px; height: 45px;">
                        <i class="bi bi-envelope-fill"></i>
                    </div>
                    <div>
                        <h5 class="text-white mb-1">Email</h5>
                        <p class="text-secondary mb-0">info@powergym.com</p>
                    </div>
                </div>
                
                <hr class="my-4 border-secondary">
                
                <a href="https://wa.me/1234567890" class="btn btn-success w-100 rounded-pill py-3 fw-bold shadow hover-scale">
                    <i class="bi bi-whatsapp me-2"></i> Chat on WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
