{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card bg-dark border-0 rounded-4 shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-warning display-4"></i>
                <h2 class="fw-bold text-white mt-3 text-uppercase">Admin Access</h2>
            </div>
            
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-black border-dark text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-black border-dark text-white" id="username" name="username" required autocomplete="username">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label text-secondary fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-black border-dark text-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control bg-black border-dark text-white" id="password" name="password" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-warning w-100 rounded-pill fw-bold py-2 text-uppercase hover-scale">Secure Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
